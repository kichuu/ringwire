name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead, see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you got, and a minimal reproduction (raw request bytes are ideal).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ringwire version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "Output of: node -v; uname -r; and server.backend (io_uring or node)"
    validations:
      required: true
